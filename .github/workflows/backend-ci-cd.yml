name: Backend CI/CD

on:
  push:
    
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: false

      - name: Build Docker Image
        run: |
          cd backend
          docker build -t starttech-backend .